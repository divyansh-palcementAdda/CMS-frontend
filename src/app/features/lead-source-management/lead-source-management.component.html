<div class="dashboard-layout">
  <app-sidebar></app-sidebar>
  <div class="dashboard-body">
    <app-topbar></app-topbar>
    <main class="main-content">
      <div class="content-header">
        <div class="header-title-area">
          <h2 class="page-title">Lead Source Management</h2>
          <p class="page-subtitle">Manage dynamic sources for student admissions</p>
        </div>
        <div class="header-actions">
          <button class="btn-primary" (click)="openAddModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add New Source</span>
          </button>
        </div>
      </div>

      <div class="table-card stat-card table-only">
        <div class="table-header">
          <h3 class="table-title">All Lead Sources</h3>
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Search Lead Source" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()">
          </div>
        </div>

        <div class="table-responsive">
          <table class="cms-table">
            <thead>
              <tr>
                <th>S.No.</th>
                <th>Source Name</th>
                <th>Created At</th>
                <th>Status</th>
                <th class="text-right">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let ls of filteredLeadSources; let i = index">
                <td>{{ i + 1 }}</td>
                <td>
                  <div class="source-info">
                    <span class="source-name">{{ ls.name }}</span>
                    <span class="source-id" title="UUID ID">{{ ls.id }}</span>
                  </div>
                </td>
                <td>{{ ls.createdAt | date:'mediumDate' }}</td>
                <td>
                  <span class="status-badge" [class.active]="ls.active" [class.inactive]="!ls.active">
                    {{ ls.active ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="text-right">
                  <div class="action-buttons">
                    <button class="action-btn edit-btn" (click)="onEdit(ls)" title="Edit">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                      </svg>
                    </button>
                    <button class="action-btn status-btn" (click)="onToggleStatus(ls)" [title]="ls.active ? 'Deactivate' : 'Activate'">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                      </svg>
                    </button>
                    <button class="action-btn delete-btn" (click)="onDelete(ls)" title="Delete">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="filteredLeadSources.length === 0 && !loading">
                <td colspan="5" class="empty-state">No lead sources found</td>
              </tr>
              <tr *ngIf="loading">
                <td colspan="5" class="loading-state">Loading lead sources...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<app-ls-add-modal
  *ngIf="showAddModal"
  [id]="editingId"
  (closed)="showAddModal = false"
  (success)="fetchData()">
</app-ls-add-modal>

<app-confirmation-modal
  *ngIf="showDeleteModal"
  [title]="'Delete Lead Source'"
  [message]="'Are you sure you want to delete \'' + selectedLeadSource?.name + '\'? This action cannot be undone.'"
  (confirm)="confirmDelete()"
  (cancel)="showDeleteModal = false">
</app-confirmation-modal>
